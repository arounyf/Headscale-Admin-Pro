name: Build and Push (runyf)

on:
  push:
    branches: [ hs-admin ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # Tags only. The Tests workflow cannot cover a tag push: its path filter
  # compares against a base commit, and a new tag has none, so every step
  # comes back "skipped" and the run reports success without running
  # anything. That is how a commit whose tests failed reached a release.
  # This job is therefore the only test a release candidate ever gets.
  test:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 2

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix',
            '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}

      - name: Run tests
        env:
          # As of 2025-01-06, these env vars was not automatically
          # set anymore which breaks the initdb for postgres on
          # some of the database migration tests.
          LC_ALL: "en_US.UTF-8"
          LC_CTYPE: "en_US.UTF-8"
        # See .github/workflows/test.yml: hscontrol/servertest needs more than
        # go test's 10m per-package default on a 4 vCPU runner.
        run: nix develop --command -- gotestsum -- -timeout=30m

  binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o headscale ./cmd/headscale

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: headscale-linux-amd64
          path: headscale

  release:
    # The gate. Written with always() and explicit result checks rather
    # than relying on needs: alone, because a job-level if: replaces the
    # implicit success() check — spelled out, a failed or skipped test
    # can never reach the release step, whatever the runner's default.
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/')
      && needs.test.result == 'success'
      && needs.binary.result == 'success'
    needs: [test, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: headscale-linux-amd64
          path: .

      - name: Generate release notes
        run: |
          # A body written by hand at .github/release-notes/<tag>.md wins;
          # the generated commit list is only a fallback.
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" /tmp/notes.md
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD~ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since $PREV_TAG" > /tmp/notes.md
              echo '```' >> /tmp/notes.md
              git log --oneline $PREV_TAG..HEAD >> /tmp/notes.md
              echo '```' >> /tmp/notes.md
            else
              echo "## Commits" > /tmp/notes.md
              echo '```' >> /tmp/notes.md
              git log --oneline --max-count=20 >> /tmp/notes.md
              echo '```' >> /tmp/notes.md
            fi
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          files: headscale
