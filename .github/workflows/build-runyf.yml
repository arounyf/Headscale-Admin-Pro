name: Build and Push (runyf)

on:
  push:
    branches: [ hs-admin ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o headscale ./cmd/headscale

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: headscale-linux-amd64
          path: headscale

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: headscale-linux-amd64
          path: .

      - name: Generate release notes
        run: |
          # A body written by hand at .github/release-notes/<tag>.md wins;
          # the generated commit list is only a fallback.
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" /tmp/notes.md
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD~ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since $PREV_TAG" > /tmp/notes.md
              echo '```' >> /tmp/notes.md
              git log --oneline $PREV_TAG..HEAD >> /tmp/notes.md
              echo '```' >> /tmp/notes.md
            else
              echo "## Commits" > /tmp/notes.md
              echo '```' >> /tmp/notes.md
              git log --oneline --max-count=20 >> /tmp/notes.md
              echo '```' >> /tmp/notes.md
            fi
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          files: headscale
