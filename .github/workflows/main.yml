name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: runyf/hs-admin
          # latest=auto 是默认值，会给每个 tag 事件都追加一个 :latest，
          # 预发布也不例外 —— 推 v5.4-beta 时它就这样把 :latest 从 v5.3
          # 顶掉了。这里显式关掉，:latest 只由下面 "Tag stable release as
          # latest" 那一步来加，而它仅在 stable tag 上才会执行。
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag

      - name: Determine if stable release
        id: release
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            # 两段和三段都算稳定版：v5.4 和 v5.4.1 是同一类东西，只是后者
            # 补了 patch。原来的 `^v[0-9]+\.[0-9]+$` 只认两段，三段会掉进
            # 下面的 else，被当成预发布 —— v5.4.1 那样的版本号会被悄悄标成
            # Pre-release 且不更新 :latest。带 -beta/-rc 这些后缀的仍然不是
            # 稳定版（正则里没有容纳后缀，所以自然落进 else）。
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "stable=true" >> $GITHUB_OUTPUT
              echo "prerelease=false" >> $GITHUB_OUTPUT
              echo "Stable release: $TAG → will push as :latest"
            else
              echo "stable=false" >> $GITHUB_OUTPUT
              echo "prerelease=true" >> $GITHUB_OUTPUT
              echo "Pre-release: $TAG (no :latest)"
            fi
          else
            echo "stable=false" >> $GITHUB_OUTPUT
          fi

      - name: Record build timestamp
        id: stamp
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # 构建上下文里没有 .git（.dockerignore 排掉了），Dockerfile 查不到
          # 这两个值，只能从这里传。不传的话镜像里的 headscale 会报
          # commit/build time 为 unknown。
          build-args: |
            HS_COMMIT=${{ github.sha }}
            HS_BUILD_TIME=${{ steps.stamp.outputs.time }}
          push: ${{ github.ref_type == 'tag' }}
          # 这里原来是 no-cache + 每次变化的 CACHE_BUST，用来逼 wget 那层
          # 重新下载二进制。二进制现在由 headscale/ 源码构建，no-cache 只会让
          # 每次构建都重下一遍三 GB 的 Go 依赖，所以换成 GHA 层缓存。
          #
          # mode=max 是必要的：builder 阶段那些 apt/pip 层、以及 hs-builder 的
          # go mod download 都不是最终镜像的层，不带 max 导出的话每次跑都要重来。
          # 代价是每次约 29s 的 cache export。
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Tag stable release as latest
        if: steps.release.outputs.stable == 'true'
        run: |
          docker buildx imagetools create \
            runyf/hs-admin:${{ github.ref_name }} \
            --tag runyf/hs-admin:latest

      - name: Create GitHub Release (stable)
        if: steps.release.outputs.stable == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false

      - name: Create GitHub Release (pre-release)
        if: steps.release.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true

      # 把镜像里那个 headscale 二进制挂到 Release 上（以前是从 arounyf/headscale
      # 的 release 下载，那条线已经归档）。
      #
      # 不另写 go build，而是从 Dockerfile 的 hs-builder 阶段导出：版本号取自
      # CHANGELOG、三个 -ldflags -X 怎么拼、末尾三行自检，全都还只有一处定义，
      # 发出去的资产不可能和镜像里的二进制走偏。
      #
      # 这一步**必须跟在上面的 Build and push 同一个 job 里**，不能拆成第二个
      # job。拆开的话它是从 GHA 缓存里重新拉层、并且因为 HS_BUILD_TIME 每次都变
      # 而重编一遍 —— 实测拆成两个 job 时那次多编了 90.5s（v5.4.2-beta 的运行：
      # build 147.7s + headscale-binary 115.2s）。同一个 job 里 builder 的本地缓存
      # 是热的，两个 build-arg 又和上面完全一致，所以这一步只是把已经编好的层
      # 导出成文件。也不必带 cache-from：本地缓存比 GHA 缓存更近。
      - name: Build the headscale binary out of the same builder stage
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: hs-binary
          build-args: |
            HS_COMMIT=${{ github.sha }}
            HS_BUILD_TIME=${{ steps.stamp.outputs.time }}
          outputs: type=local,dest=dist

      # 放在上面两个 Create Release 之后：release 得先存在，资产才有地方挂。
      - name: Attach it to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/headscale
