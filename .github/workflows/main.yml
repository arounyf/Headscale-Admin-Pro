name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: runyf/hs-admin
          # latest=auto 是默认值，会给每个 tag 事件都追加一个 :latest，
          # 预发布也不例外 —— 推 v5.4-beta 时它就这样把 :latest 从 v5.3
          # 顶掉了。这里显式关掉，:latest 只由下面 "Tag stable release as
          # latest" 那一步来加，而它仅在 stable tag 上才会执行。
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag

      - name: Determine if stable release
        id: release
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+$ ]]; then
              echo "stable=true" >> $GITHUB_OUTPUT
              echo "prerelease=false" >> $GITHUB_OUTPUT
              echo "Stable release: $TAG → will push as :latest"
            else
              echo "stable=false" >> $GITHUB_OUTPUT
              echo "prerelease=true" >> $GITHUB_OUTPUT
              echo "Pre-release: $TAG (no :latest)"
            fi
          else
            echo "stable=false" >> $GITHUB_OUTPUT
          fi

      - name: Record build timestamp
        id: stamp
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # 构建上下文里没有 .git（.dockerignore 排掉了），Dockerfile 查不到
          # 这两个值，只能从这里传。不传的话镜像里的 headscale 会报
          # commit/build time 为 unknown。
          build-args: |
            HS_COMMIT=${{ github.sha }}
            HS_BUILD_TIME=${{ steps.stamp.outputs.time }}
          push: ${{ github.ref_type == 'tag' }}
          # 这里原来是 no-cache + 每次变化的 CACHE_BUST，用来逼 wget 那层
          # 重新下载二进制。二进制现在由 headscale/ 源码构建，no-cache 只会让
          # 每次构建都重下一遍三 GB 的 Go 依赖，所以换成 GHA 层缓存。
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Tag stable release as latest
        if: steps.release.outputs.stable == 'true'
        run: |
          docker buildx imagetools create \
            runyf/hs-admin:${{ github.ref_name }} \
            --tag runyf/hs-admin:latest

      - name: Create GitHub Release (stable)
        if: steps.release.outputs.stable == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false

      - name: Create GitHub Release (pre-release)
        if: steps.release.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
